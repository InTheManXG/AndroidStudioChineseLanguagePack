<html>The\ minimum\ SDK\ version\ determines\ the\ lowest\ level\ of\ Android\ that\ your\ app\ will\ run\ on.\ <br><br>\ You\ typically\ want\ to\ target\ as\ many\ users\ as\ possible,\ so\ you\ would\ ideally\ want\ to\ support\ everyone\ --\ with\ a\ minimum\ SDK\ version\ of\ 1.\ However,\ that\ has\ some\ disadvantages,\ such\ as\ lack\ of\ features,\ and\ very\ few\ people\ use\ devices\ that\ old\ anymore.\ <br><br>\ Your\ choice\ of\ minimum\ SDK\ level\ should\ be\ a\ tradeoff\ between\ the\ distribution\ of\ users\ you\ wish\ to\ target\ and\ the\ features\ that\ your\ application\ will\ need.\ <br><br>\ <b>Click\ each\ Android\ Version/API\ level\ for\ more\ information.</b>\ </html>=<html>最低 SDK 版本决定应用能够运行的最低 Android 版本。<br><br>通常你会希望覆盖尽可能多的用户，理想情况下可将最低 SDK 版本设为 1，以支持所有用户。但这也有缺点，例如缺少功能，而且现在几乎没有人再使用如此旧的设备。<br><br>选择最低 SDK 级别时，应权衡目标用户的版本分布与应用所需的功能。<br><br><b>点击各个 Android 版本/API 级别可了解详情。</b></html>
<html>The\ total\ number\ of\ physical\ pixels\ on\ a\ screen.\ When\ adding\ support\ for\ multiple\ screens,\ applications\ do\ not\ work\ directly\ with\ resolution;\ applications\ should\ be\ concerned\ only\ with\ screen\ size\ and\ density,\ as\ specified\ by\ the\ generalized\ size\ and\ density\ groups.\ \ Height\ in\ pixels\ </html>=<html>屏幕上物理像素的总数。支持多种屏幕时，应用不直接依赖分辨率，而应关注通用尺寸和密度分组中定义的屏幕尺寸与密度。高度（像素）</html>
