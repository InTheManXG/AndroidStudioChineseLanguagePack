The\ default\ handling\ of\ <uses-sdk>\ in\ the\ main\ manifest\ is\ changing,\ \nmeaning\ that\ use\ of\ the\ tag\ will\ result\ in\ build\ errors.\nThis\ processor\ adds\ a\ flag\ to\ preserve\ the\ previous\ behavior\ (show\ warnings\ instead\ of\ errors).=主清单中 <uses-sdk> 的默认处理即将更改，\n这意味着使用该标记会导致构建错误。\n此处理器会添加一个标志来保留之前的行为(显示警告而非错误)。
The\ default\ value\ for\n`android.dependency.useConstraints`\ is\nchanging,\ meaning\ that\ the\ Android\ Gradle\ Plugin\ will\ no\ longer\nalign\ runtime\ and\ compile\ classpaths\nThis\ is\ expected\ to\ improve\ performance.\ You\ can\ remove\ the\nproperty\ from\ gradle.properties\ after\ the\ upgrade\ to\ switch\ to\ the\nimproved\ behavior.=`android.dependency.useConstraints` 的默认值即将更改，这意味着 Android Gradle 插件将不再对齐运行时和编译类路径。这有望提升性能。升级后，您可以从 gradle.properties 中移除该属性，以切换到改进后的行为。
The\ default\ value\ for\ Enable\ App\ Compile-Time\ R\ Class\ is\ changing,\ meaning\ that\ App\ Compile-Time\ R\ Class\ will\nbe\ enabled\ by\ default\ now.\ This\ processor\ adds\ a\ flag\ to\ preserve\ the\ previous\nbehavior.=“启用应用编译时 R 类”的默认值即将更改，这意味着现在默认将启用“应用编译时 R 类”。此处理器会添加一个标志来保留之前的行为。
The\ default\ value\ for\ R8\ Optimized\ Resource\ Shrinking\ is\ changing,\ meaning\ that\ R8\ Optimized\ Resource\ Shrinking\ will\nbe\ enabled\ by\ default\ now.\ This\ processor\ adds\ a\ flag\ to\ preserve\ the\ previous\nbehavior\ (to\ not\ use\ the\ R8\ Optimized\ Resource\ Shrinking).=R8 优化资源缩减的默认值即将更改，这意味着 R8 优化资源缩减现在将默认启用。此处理器会添加一个标志来保留之前的行为(不使用 R8 优化资源缩减)。
The\ default\ value\ for\ R8\ Strict\ Mode\ for\ Keep\ Rules\ is\ changing,\ meaning\ that\ R8\ Strict\ Mode\ will\nbe\ enabled\ by\ default\ now.\ This\ processor\ adds\ a\ flag\ to\ preserve\ the\ previous\nbehavior\ (to\ not\ use\ the\ R8\ Strict\ Mode\ for\ Keep\ Rules).=“针对 Keep 规则的 R8 严格模式”的默认值即将更改，这意味着 R8 严格模式现在将默认启用。此处理器添加了一个标志以保留之前的行为(不使用“针对 Keep 规则的 R8 严格模式”)。
The\ default\ value\ for\ Unique\ Package\ Names\ is\ changing\ in\ 9.0.\ It\ will\ now\ be\ enabledby\ default.\ This\ processor\ adds\ a\ flag\ to\ preserve\ the\ previous\ behavior.=9.0 版本中“唯一软件包名称”的默认值即将更改。现在将默认启用。此处理器会添加一个标志以保留之前的行为。
The\ default\ value\ for\ targetSdk\ is\ changing,\ meaning\ that\ defaulting\ targetSdk\ to\ compileSdk\ will\nbe\ enabled\ by\ default\ now.\ This\ processor\ adds\ a\ flag\ to\ preserve\ the\ previous\ behavior\ (to\ default\ to\ minSdk)=targetSdk 的默认值即将更改，这意味着现在将默认启用 targetSdk 默认为 compileSdk。此处理器会添加一个标志来保留之前的行为(默认为 minSdk)。
The\ default\ value\ for\ useAndroidX\ is\ changing,\ meaning\ that\ AndroidX\ libraries\ will\nbe\ available\ by\ default\ now.\ This\ processor\ adds\ a\ flag\ to\ preserve\ the\ previous\nbehavior\ (to\ not\ use\ AndroidX).=useAndroidX 的默认值即将更改，这意味着 AndroidX 库现在将默认可用。此处理器会添加一个标志来保留之前的行为(不使用 AndroidX)。
